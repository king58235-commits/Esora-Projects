<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0e1c" />
  <meta name="description" content="Esora 的遊戲與工具作品集，收錄小遊戲、個人工具與實驗作品。" />
  <title>Esora's Project Archive</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e1c;
      --panel: rgba(22, 27, 51, .88);
      --panel-2: #1c2240;
      --panel-3: #252c52;
      --line: #2a3159;
      --line-bright: #3a4377;
      --text: #ece8f6;
      --muted: #9ea5c6;
      --faint: #6c739b;
      --gold: #e8c27e;
      --gold-light: #f6dca6;
      --accent: #8ea2ff;
      --violet: #b48cff;
      --radius: 18px;
      --shadow: 0 18px 44px rgba(0, 0, 0, .28);
      --font: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font: 15px/1.65 var(--font);
      background:
        radial-gradient(1000px 640px at 12% -15%, rgba(74, 48, 143, .48), transparent 64%),
        radial-gradient(850px 560px at 100% 3%, rgba(20, 75, 113, .34), transparent 62%),
        radial-gradient(850px 650px at 48% 110%, rgba(69, 39, 103, .28), transparent 65%),
        var(--bg);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .52;
      background-image:
        radial-gradient(1px 1px at 23px 37px, rgba(255,255,255,.82), transparent 1.5px),
        radial-gradient(1px 1px at 141px 92px, rgba(255,255,255,.56), transparent 1.5px),
        radial-gradient(1.4px 1.4px at 77px 160px, rgba(246,220,166,.72), transparent 2px),
        radial-gradient(1px 1px at 190px 15px, rgba(180,200,255,.7), transparent 1.5px);
      background-size: 210px 210px, 260px 260px, 330px 330px, 290px 290px;
    }
    a { color: inherit; }
    button, input { font: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }
    ::selection { color: #211a2e; background: rgba(232,194,126,.75); }

    .shell { width: min(1160px, calc(100% - 36px)); margin: 0 auto; padding: 46px 0 38px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 52px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--gold-light); font-size: .82rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .brand-mark {
      display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid rgba(232,194,126,.45);
      border-radius: 12px; background: linear-gradient(145deg, rgba(232,194,126,.2), rgba(142,162,255,.13));
      box-shadow: 0 0 26px rgba(232,194,126,.12); font-size: 18px;
    }
    .github-link { color: var(--muted); font-size: .88rem; text-decoration: none; transition: color .18s; }
    .github-link:hover { color: var(--gold-light); }

    .hero { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 32px; margin-bottom: 38px; }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 13px; color: var(--gold); font: 700 .76rem/1.4 ui-monospace, "Cascadia Mono", monospace; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: "✦"; font-size: 1rem; }
    h1 { max-width: 760px; margin: 0; font: 700 clamp(2.6rem, 7vw, 5rem)/1.12 var(--serif); letter-spacing: .055em; color: transparent; background: linear-gradient(100deg, #fff0c7 0%, var(--gold) 43%, #d2bcff 82%); -webkit-background-clip: text; background-clip: text; }
    .intro { max-width: 640px; margin: 18px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.9; }
    .count-card { min-width: 150px; padding: 19px 24px; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(160deg, rgba(30,36,68,.84), rgba(16,20,43,.78)); box-shadow: var(--shadow); text-align: center; }
    .count-card strong { display: block; color: var(--gold-light); font: 700 2.4rem/1 var(--serif); }
    .count-card span { display: block; margin-top: 9px; color: var(--muted); font-size: .78rem; letter-spacing: .08em; }

    .library { padding: 20px; border: 1px solid rgba(58,67,119,.75); border-radius: 22px; background: linear-gradient(180deg, rgba(22,27,51,.74), rgba(14,18,37,.76)); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 21px; }
    .search-wrap { position: relative; flex: 1; }
    .search-icon { position: absolute; top: 50%; left: 15px; color: var(--faint); transform: translateY(-50%); pointer-events: none; }
    .search { width: 100%; min-height: 46px; padding: 11px 15px 11px 43px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: rgba(12,16,34,.78); transition: border-color .18s, box-shadow .18s; }
    .search::placeholder { color: var(--faint); }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(142,162,255,.14); outline: 0; }
    .filters { display: flex; flex: none; gap: 5px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.025); }
    .filter { padding: 8px 14px; border: 0; border-radius: 999px; color: var(--muted); background: transparent; cursor: pointer; transition: color .16s, background .16s, box-shadow .16s; white-space: nowrap; }
    .filter:hover { color: var(--text); }
    .filter[aria-pressed="true"] { color: var(--gold-light); background: linear-gradient(180deg, #303968, #222a53); box-shadow: inset 0 0 0 1px var(--line-bright); }

    .section-heading { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 15px; color: var(--gold-light); font: 700 1rem var(--serif); letter-spacing: .08em; }
    .section-heading::before { content: "✦"; color: var(--gold); font-size: .8em; }
    .section-heading small { color: var(--faint); font: 500 .75rem var(--font); letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .card {
      --card-accent: var(--accent);
      position: relative; display: flex; min-height: 272px; flex-direction: column; overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(30,36,68,.94), rgba(17,21,42,.94));
      box-shadow: 0 10px 26px rgba(0,0,0,.16);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      animation: rise .42s both;
    }
    .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, transparent, var(--card-accent), transparent); opacity: .82; }
    .card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--card-accent), var(--line) 48%); box-shadow: 0 18px 36px rgba(0,0,0,.29), 0 0 28px color-mix(in srgb, var(--card-accent), transparent 87%); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 0; }
    .icon { display: grid; place-items: center; width: 52px; height: 52px; flex: none; border: 1px solid color-mix(in srgb, var(--card-accent), transparent 63%); border-radius: 16px; background: linear-gradient(145deg, color-mix(in srgb, var(--card-accent), transparent 82%), rgba(255,255,255,.035)); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); font-size: 1.65rem; }
    .tag { display: inline-flex; align-items: center; gap: 6px; min-height: 25px; padding: 4px 9px; border: 1px solid color-mix(in srgb, var(--card-accent), transparent 72%); border-radius: 999px; color: var(--card-accent); background: color-mix(in srgb, var(--card-accent), transparent 92%); font-size: .68rem; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 9px currentColor; }
    .card-body { display: flex; flex: 1; flex-direction: column; padding: 16px 18px 18px; }
    .card-title { margin: 0; color: var(--text); font: 700 1.12rem/1.45 var(--serif); letter-spacing: .035em; }
    .card-description { flex: 1; margin: 9px 0 17px; color: var(--muted); font-size: .84rem; line-height: 1.75; }
    .card-actions { display: flex; align-items: center; gap: 9px; margin-top: auto; }
    .open-link { display: inline-flex; flex: 1; align-items: center; justify-content: center; gap: 8px; min-height: 41px; padding: 9px 13px; border: 1px solid rgba(246,220,166,.62); border-radius: 10px; color: #241b0c; background: linear-gradient(180deg, #f3d699, #d8a659); box-shadow: 0 7px 18px -12px rgba(232,194,126,.9); font-size: .82rem; font-weight: 800; text-decoration: none; transition: filter .16s, transform .16s; }
    .open-link:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .repo-link { display: grid; width: 40px; height: 40px; flex: none; place-items: center; border: 1px solid var(--line-bright); border-radius: 10px; color: var(--muted); background: rgba(255,255,255,.025); text-decoration: none; transition: border-color .16s, color .16s, background .16s; }
    .repo-link:hover { color: var(--gold-light); border-color: var(--gold-dim, #8a6d3b); background: rgba(232,194,126,.08); }
    .empty { grid-column: 1 / -1; padding: 46px 20px; border: 1px dashed var(--line-bright); border-radius: 15px; color: var(--muted); text-align: center; }
    footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; padding: 15px 2px 0; border-top: 1px solid rgba(58,67,119,.45); color: var(--faint); font-size: .75rem; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--gold-light); }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1160px); padding-top: 27px; }
      .topline { margin-bottom: 37px; }
      .hero { grid-template-columns: 1fr; gap: 20px; margin-bottom: 25px; }
      .count-card { display: flex; width: fit-content; align-items: baseline; gap: 10px; padding: 12px 16px; }
      .count-card strong { font-size: 1.8rem; }
      .count-card span { margin: 0; }
      .library { padding: 13px; border-radius: 17px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .filters { width: 100%; justify-content: space-between; }
      .filter { flex: 1; padding-inline: 9px; }
      .grid { grid-template-columns: 1fr; gap: 11px; }
      .card { min-height: 0; }
      .card-body { padding-top: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topline" aria-label="主要導覽">
      <a class="brand" href="https://github.com/king58235-commits/Esora-Projects/" aria-label="Esora's Project Archive 首頁">
        <span class="brand-mark" aria-hidden="true">✧</span>
        <span>Esora · Project Archive</span>
      </a>
      <a class="github-link" href="https://github.com/king58235-commits" target="_blank" rel="noopener noreferrer">GitHub 個人頁 ↗</a>
    </nav>

    <header class="hero">
      <div>
        <p class="eyebrow">A small universe of experiments</p>
        <h1>作品收藏室</h1>
        <p class="intro">遊戲、實用工具，還有一些想到就動手做的小實驗。挑一個感興趣的，進去逛逛吧。</p>
      </div>
      <div class="count-card" aria-label="作品數量">
        <strong id="projectCount">0</strong>
        <span>件收錄作品</span>
      </div>
    </header>

    <section class="library" aria-label="作品列表">
      <div class="toolbar">
        <label class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" class="search" type="search" placeholder="搜尋作品名稱或介紹…" autocomplete="off" />
        </label>
        <div class="filters" role="group" aria-label="作品類型">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter" type="button" data-filter="game" aria-pressed="false">遊戲</button>
          <button class="filter" type="button" data-filter="tool" aria-pressed="false">工具</button>
        </div>
      </div>
      <h2 class="section-heading">全部作品 <small id="resultCount"></small></h2>
      <div id="projectGrid" class="grid" aria-live="polite"></div>
    </section>

    <footer>
      <span>© <span id="currentYear"></span> Esora · Made one idea at a time</span>
      <a href="https://github.com/king58235-commits/Esora-Projects" target="_blank" rel="noopener noreferrer">檢視入口頁原始碼 ↗</a>
    </footer>
  </main>

  <script>
    // 新增作品時只需複製一筆資料，填好名稱、簡介和兩個網址。
    const projects = [
      { name: "每日飲食扣打", description: "手機優先的離線飲食紀錄工具，快速記下常吃食物，掌握每日熱量與蛋白質。資料保存在自己的裝置。", url: "https://king58235-commits.github.io/kouda-app/", repo: "https://github.com/king58235-commits/kouda-app", icon: "🥗", kind: "tool", label: "生活工具", color: "#79dcb0" },
      { name: "煤炭 or 禮物", description: "肌肉聖誕老人登場！把禮物送給好孩子、煤炭丟給壞孩子，留意偽裝者和雪怪。", url: "https://king58235-commits.github.io/Coal-or-Gift/", repo: "https://github.com/king58235-commits/Coal-or-Gift", icon: "🎁", kind: "game", label: "小遊戲", color: "#ff9a9e" },
      { name: "中秋海邊烤肉攤", description: "在海邊經營烤肉攤，照客人的順序串好食材、掌握火候，把烤串在完美時刻送上桌。", url: "https://king58235-commits.github.io/Let-s-BBQ/", repo: "https://github.com/king58235-commits/Let-s-BBQ", icon: "🍢", kind: "game", label: "小遊戲", color: "#ffcf8a" },
      { name: "契獸靈感產生器", description: "用靈感抽選器組合出奇幻契獸點子，替下一個角色或故事找個起點。", url: "https://king58235-commits.github.io/Poof-/", repo: "https://github.com/king58235-commits/Poof-", icon: "🪄", kind: "tool", label: "創作工具", color: "#b48cff" },
      { name: "動畫猜歌主持台", description: "支援自訂題庫、YouTube 片段、隊伍計分與結算功能的動畫猜歌工具。", url: "https://king58235-commits.github.io/AnimeSongQuiz/", repo: "https://github.com/king58235-commits/AnimeSongQuiz", icon: "🎵", kind: "tool", label: "派對工具", color: "#ec6f91" },
      { name: "搶答器", description: "主持人開房間，大家用手機掃描 QR Code 加入，即時一起搶答。", url: "https://king58235-commits.github.io/anime-quiz-buzzer/", repo: "https://github.com/king58235-commits/anime-quiz-buzzer", icon: "⚡", kind: "tool", label: "派對工具", color: "#8ea2ff" },
      { name: "忍者夜行", description: "有二段跳與清圖必殺技的橫向動作小遊戲。", url: "https://king58235-commits.github.io/NightJumpTest/", repo: "https://github.com/king58235-commits/NightJumpTest", icon: "🐾", kind: "game", label: "開發中", color: "#56c4d8" },
      { name: "跳跳記數", description: "點一下角色就跳一下、數字加一，一款簡單又有點無厘頭的小遊戲。", url: "https://king58235-commits.github.io/PixelClickGirl/", repo: "https://github.com/king58235-commits/PixelClickGirl", icon: "🎮", kind: "game", label: "小遊戲", color: "#b48cff" },
      { name: "快遞分檢", description: "把包裹快速分到正確位置，也可以用 A、D 鍵操作。", url: "https://king58235-commits.github.io/SortingMaster/", repo: "https://github.com/king58235-commits/SortingMaster", icon: "📦", kind: "game", label: "小遊戲", color: "#79dcb0" },
      { name: "放板金塊 GAME", description: "瞄準空位放下方塊，沒接好就會失敗。", url: "https://king58235-commits.github.io/GlodenYuGi/", repo: "https://github.com/king58235-commits/GlodenYuGi", icon: "🧱", kind: "game", label: "小遊戲", color: "#ffcf8a" },
      { name: "塔防", description: "設置防禦、迎戰敵人，並可自訂遊戲難度。", url: "https://king58235-commits.github.io/MaBT/", repo: "https://github.com/king58235-commits/MaBT", icon: "🏰", kind: "game", label: "小遊戲", color: "#ff9a9e" }
    ];

    const grid = document.getElementById("projectGrid");
    const searchInput = document.getElementById("searchInput");
    const resultCount = document.getElementById("resultCount");
    const projectCount = document.getElementById("projectCount");
    let activeFilter = "all";

    function escapeHtml(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function createCard(project, index) {
      return '<article class="card" style="--card-accent:' + escapeHtml(project.color) + ';animation-delay:' + Math.min(index * 45, 360) + 'ms">' +
        '<div class="card-head"><div class="icon" aria-hidden="true">' + escapeHtml(project.icon) + '</div><span class="tag">' + escapeHtml(project.label) + '</span></div>' +
        '<div class="card-body"><h3 class="card-title">' + escapeHtml(project.name) + '</h3>' +
        '<p class="card-description">' + escapeHtml(project.description) + '</p>' +
        '<div class="card-actions"><a class="open-link" href="' + escapeHtml(project.url.trim()) + '" target="_blank" rel="noopener noreferrer">開啟作品 <span aria-hidden="true">↗</span></a>' +
        '<a class="repo-link" href="' + escapeHtml(project.repo) + '" target="_blank" rel="noopener noreferrer" aria-label="查看 ' + escapeHtml(project.name) + ' 的 GitHub 專案" title="GitHub 原始碼">⌘</a></div></div></article>';
    }

    function renderProjects() {
      const keyword = searchInput.value.trim().toLocaleLowerCase();
      const filtered = projects.filter(function (project) {
        const matchesKind = activeFilter === "all" || project.kind === activeFilter;
        const matchesText = (project.name + " " + project.description + " " + project.label).toLocaleLowerCase().includes(keyword);
        return matchesKind && matchesText;
      });
      projectCount.textContent = String(projects.length);
      resultCount.textContent = "· " + filtered.length + " 件";
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">找不到符合「' + escapeHtml(searchInput.value.trim()) + '」的作品，試試其他關鍵字吧。</div>';
        return;
      }
      grid.innerHTML = filtered.map(createCard).join("");
    }

    document.querySelectorAll(".filter").forEach(function (button) {
      button.addEventListener("click", function () {
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".filter").forEach(function (item) {
          item.setAttribute("aria-pressed", String(item === button));
        });
        renderProjects();
      });
    });
    searchInput.addEventListener("input", renderProjects);
    document.getElementById("currentYear").textContent = String(new Date().getFullYear());
    renderProjects();
  </script>
</body>
</html>
